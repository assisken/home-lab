apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jellyfin
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
      annotations:
        # Needs <EnableMetrics>true</EnableMetrics> in /config/system.xml on the
        # PVC (Dashboard → General → Enable Prometheus metrics). Set 2026-10-07.
        # The public route to /metrics is blocked by jellyfin-metrics-ingress.yaml.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8096"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - home-lab
      containers:
        - env:
            - name: JELLYFIN_PublishedServerUrl
              value: http://192.168.1.2
            - name: PGID
              value: "1001"
            - name: PUID
              value: "1001"
            - name: TZ
              value: Etc/UTC
          image: lscr.io/linuxserver/jellyfin:12.3ubu2604-ls56
          name: jellyfin
          resources:
            limits:
              cpu: 6000m
              memory: 6Gi
            requests:
              cpu: 1000m
              memory: 4Gi
          livenessProbe:
            exec:
              command:
                - curl
                - -i
                - http://localhost:8096/health
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 120
            timeoutSeconds: 10
          ports:
            - containerPort: 8096
              protocol: TCP
            - containerPort: 7359
              protocol: UDP
            - containerPort: 1900
              protocol: UDP
          volumeMounts:
            - mountPath: /config
              name: jellyfin-claim0
            - mountPath: /media
              name: media
            # VAAPI acceleration
            - mountPath: /dev/dri/renderD128
              name: render-d128
          securityContext:
            privileged: true
      restartPolicy: Always
      volumes:
        - name: jellyfin-claim0
          persistentVolumeClaim:
            claimName: jellyfin-claim0
        - name: media
          hostPath:
            path: /var/mnt/media/downloads
            type: Directory
        # VAAPI acceleration
        - name: render-d128
          hostPath:
            path: /dev/dri/renderD128
