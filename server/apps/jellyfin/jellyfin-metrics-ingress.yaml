# tv.example.com is public, and /metrics has no auth. Jellyfin limits it to "local"
# clients, but behind Traefik every request comes from a pod IP (10.x), so it
# counts as local: the metrics were readable from the internet. This
# more specific route (Traefik prefers the longer rule) puts the path behind
# the LAN allow-list. Prometheus scrapes the pod directly and is
# unaffected.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-metrics
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: default-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tv.example.com
  rules:
    - host: tv.example.com
      http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
