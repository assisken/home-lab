apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# rancher local-path-provisioner, the `local-path` StorageClass every PVC uses.
# The Talos root filesystem is read-only, so PVCs live on the dedicated
# `local-path` user volume (talos/patches/volumes.yaml) at /var/mnt/local-path.
#
#   kubectl apply -k server/local-path
#
# Not part of the root overlay: it must exist before anything that claims a
# PVC, and its namespace is exempt from Pod Security (talos/patches/cluster.yaml)
# because the helper pods mount hostPath.
resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.36/deploy/local-path-storage.yaml

patches:
  - target:
      kind: ConfigMap
      name: local-path-config
    patch: |-
      - op: replace
        path: /data/config.json
        value: |-
          {
            "nodePathMap": [
              {
                "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths": ["/var/mnt/local-path"]
              }
            ]
          }
  # The default class, as on the old cluster, so nothing has to name it.
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
